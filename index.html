<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#19150f" />
    <title>悟空与唐僧</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #15120d;
        font-family: 'STKaiti', 'KaiTi', 'PingFang SC', sans-serif;
        color: #2b2015;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #4d4130 0, #18140f 70%);
      }
      #app {
        position: relative;
        width: 100%;
        max-width: 480px;
        height: 100dvh;
        max-height: 900px;
        overflow: hidden;
        background: #d8c191;
        box-shadow: 0 0 70px #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        z-index: 10;
      }
      .screen.show {
        display: flex;
      }
      #home {
        align-items: center;
        justify-content: flex-end;
        flex-direction: column;
        padding: 0 28px max(46px, env(safe-area-inset-bottom));
        background:
          linear-gradient(
            180deg,
            rgba(8, 12, 11, 0.04) 0,
            rgba(9, 11, 9, 0.04) 42%,
            rgba(18, 13, 7, 0.83) 100%
          ),
          radial-gradient(circle at 72% 19%, #ffd678 0 5%, transparent 18%),
          linear-gradient(
            180deg,
            #82b7bb 0 31%,
            #c9bea0 31% 59%,
            #5c6d49 59% 100%
          );
      }
      #home:before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
              155deg,
              transparent 0 48%,
              #61745f 49% 56%,
              transparent 57%
            )
            0 20%/160% 43% no-repeat,
          linear-gradient(
              25deg,
              transparent 0 44%,
              #33483b 45% 54%,
              transparent 55%
            )
            0 28%/190% 42% no-repeat;
        opacity: 0.75;
      }
      .hero-art {
        position: absolute;
        inset: 7% 0 auto;
        height: 58%;
        filter: drop-shadow(0 16px 12px #20201455);
      }
      .sun {
        position: absolute;
        width: 126px;
        height: 126px;
        border-radius: 50%;
        background: #ffd97c;
        top: 7%;
        right: 10%;
        box-shadow: 0 0 50px #ffdd96;
      }
      .monk-art {
        position: absolute;
        right: 17%;
        bottom: 3%;
        width: 150px;
        height: 235px;
      }
      .monk-art .head {
        position: absolute;
        left: 44px;
        top: 30px;
        width: 64px;
        height: 72px;
        border-radius: 46% 46% 42% 42%;
        background: #f1c69b;
        border: 4px solid #38261d;
      }
      .monk-art .hat {
        position: absolute;
        left: 35px;
        top: 10px;
        width: 80px;
        height: 54px;
        background: #c63f2e;
        clip-path: polygon(50% 0, 100% 86%, 77% 100%, 50% 69%, 22% 100%, 0 86%);
        border-radius: 50%;
      }
      .monk-art .robe {
        position: absolute;
        left: 18px;
        top: 94px;
        width: 116px;
        height: 137px;
        background: #ce4930;
        clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
        border: 5px solid #3b261b;
      }
      .monk-art .staff {
        position: absolute;
        right: -6px;
        top: 0;
        width: 8px;
        height: 231px;
        background: #6e3c20;
        border: 2px solid #2f1c13;
      }
      .monk-art .staff:before {
        content: '';
        position: absolute;
        left: -18px;
        top: -10px;
        width: 40px;
        height: 54px;
        border: 7px double #d9a536;
        border-radius: 50%;
      }
      .wukong-art {
        position: absolute;
        left: 4%;
        bottom: 0;
        width: 250px;
        height: 290px;
        transform: rotate(-3deg);
      }
      .wukong-art .cape {
        position: absolute;
        left: 20px;
        top: 107px;
        width: 170px;
        height: 133px;
        background: #b22d21;
        clip-path: polygon(21% 0, 100% 25%, 63% 100%, 0 72%);
      }
      .wukong-art .body {
        position: absolute;
        left: 83px;
        top: 104px;
        width: 91px;
        height: 135px;
        border: 5px solid #2a1d14;
        border-radius: 45% 45% 28% 32%;
        background: #e4a832;
      }
      .wukong-art .head {
        position: absolute;
        left: 88px;
        top: 34px;
        width: 90px;
        height: 90px;
        border: 6px solid #2c1c14;
        border-radius: 44%;
        background: #8a4e27;
        box-shadow: inset 0 18px #63331d;
      }
      .wukong-art .face {
        position: absolute;
        left: 104px;
        top: 55px;
        width: 60px;
        height: 58px;
        border-radius: 48% 48% 42% 42%;
        background: #e8bd77;
      }
      .wukong-art .face:before {
        content: '•  •';
        position: absolute;
        left: 12px;
        top: 12px;
        font: bold 22px sans-serif;
        color: #241913;
        white-space: pre;
      }
      .wukong-art .crown {
        position: absolute;
        left: 77px;
        top: 38px;
        width: 115px;
        height: 13px;
        border: 5px solid #e4bc3e;
        border-radius: 50%;
        transform: rotate(-7deg);
      }
      .wukong-art .staff {
        position: absolute;
        left: 10px;
        top: 30px;
        width: 242px;
        height: 13px;
        border: 3px solid #321f13;
        border-radius: 8px;
        background: #ca342a;
        transform: rotate(-31deg);
        box-shadow:
          inset 15px 0 #e9c153,
          inset -15px 0 #e9c153;
      }
      .brand {
        position: relative;
        z-index: 2;
        align-self: flex-start;
        margin: 0 0 auto 10px;
        padding-top: max(36px, env(safe-area-inset-top));
        color: #2c1c13;
        text-shadow: 0 2px #f5dd9c;
      }
      .brand small {
        font: 700 13px 'PingFang SC';
        letter-spacing: 0;
      }
      .brand h1 {
        margin: 4px 0;
        font-size: 52px;
        line-height: 0.98;
        letter-spacing: 0;
        writing-mode: vertical-rl;
        font-weight: 900;
      }
      .home-actions {
        position: relative;
        z-index: 2;
        width: 100%;
        display: grid;
        gap: 11px;
      }
      button {
        font: 700 16px 'PingFang SC';
        letter-spacing: 0;
        cursor: pointer;
      }
      .primary {
        height: 58px;
        border: 2px solid #f7d673;
        border-radius: 6px;
        color: #fff7db;
        background: linear-gradient(#d75432, #a52920);
        box-shadow:
          0 5px 0 #651b17,
          0 10px 24px #0008;
        text-shadow: 0 2px #6b1d17;
      }
      .secondary-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .secondary {
        height: 45px;
        border: 1px solid #dac69b;
        border-radius: 5px;
        color: #3b2a1c;
        background: #f4e8cae8;
        box-shadow: 0 3px 0 #9a835d;
      }
      .profile {
        position: relative;
        z-index: 2;
        width: calc(100% - 16px);
        display: flex;
        justify-content: space-between;
        color: #f4dfb5;
        font: 600 13px 'PingFang SC';
        margin-bottom: 15px;
        text-shadow: 0 1px #000;
      }
      .panel {
        margin: auto;
        width: calc(100% - 28px);
        max-height: calc(100% - 44px);
        overflow: auto;
        background: #f3e5c5;
        border: 3px solid #67472c;
        border-radius: 7px;
        box-shadow:
          0 12px 50px #000c,
          inset 0 0 0 2px #d1ae70;
        padding: 19px;
      }
      .panel h2 {
        margin: 0 0 14px;
        text-align: center;
        font-size: 26px;
      }
      .close {
        float: right;
        width: 34px;
        height: 34px;
        border: 0;
        background: #6a4930;
        color: #fff;
        border-radius: 50%;
        font-size: 20px;
      }
      .list {
        display: grid;
        gap: 9px;
      }
      .entry {
        display: grid;
        grid-template-columns: 47px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 9px;
        border: 1px solid #b99b66;
        background: #fff9e9;
        border-radius: 5px;
      }
      .seal {
        width: 43px;
        height: 43px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #bd3d2b;
        color: #ffe9ae;
        font-size: 21px;
        border: 3px double #f3c961;
      }
      .entry b,
      .entry span {
        display: block;
      }
      .entry small {
        color: #786852;
        font: 12px 'PingFang SC';
      }
      .entry button {
        border: 0;
        border-radius: 4px;
        padding: 8px;
        color: #fff;
        background: #a83b2c;
      }
      #toast {
        position: absolute;
        z-index: 30;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%) scale(0.9);
        padding: 10px 18px;
        border-radius: 4px;
        background: #20170de8;
        color: #ffe4a5;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        white-space: nowrap;
        font: 600 14px 'PingFang SC';
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      @media (max-height: 720px) {
        .brand h1 {
          font-size: 41px;
        }
        .hero-art {
          transform: scale(0.85);
          transform-origin: center bottom;
        }
        .primary {
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas
        id="game"
        width="900"
        height="1600"
        aria-label="悟空与唐僧游戏画面"
      ></canvas>
      <section id="home" class="screen show">
        <div class="sun"></div>
        <div class="brand">
          <small>无广告单机版</small>
          <h1>悟空与唐僧</h1>
        </div>
        <div class="hero-art">
          <div class="wukong-art">
            <i class="cape"></i><i class="body"></i><i class="head"></i
            ><i class="face"></i><i class="crown"></i><i class="staff"></i>
          </div>
          <div class="monk-art">
            <i class="robe"></i><i class="head"></i><i class="hat"></i
            ><i class="staff"></i>
          </div>
        </div>
        <div class="profile">
          <span id="rankText"></span><span id="meritText"></span>
        </div>
        <div class="home-actions">
          <button class="primary" id="startBtn">渡 劫 闯 关</button>
          <div class="secondary-row">
            <button class="secondary" id="bookBtn">西游志</button
            ><button class="secondary" id="shopBtn">功德铺</button>
          </div>
        </div>
      </section>
      <section id="modal" class="screen">
        <div class="panel">
          <button class="close" id="closeModal">×</button>
          <div id="modalBody"></div>
        </div>
      </section>
      <div id="toast"></div>
    </main>
    <script>
      ;(() => {
        'use strict'
        const C = document.querySelector('#game'),
          X = C.getContext('2d'),
          home = document.querySelector('#home'),
          modal = document.querySelector('#modal')
        const W = 900,
          H = 1600,
          GRID = { x: 54, y: 282, w: 88, h: 88, cols: 9, rows: 7 }
        const ranks = ['凡胎', '金蝉', '斗战胜佛'],
          tiers = [
            { name: '凡品', color: '#f3ead7', atk: 10, hp: 50 },
            { name: '良品', color: '#71b86a', atk: 25, hp: 120 },
            { name: '精品', color: '#548dcc', atk: 55, hp: 280 },
            { name: '极品', color: '#8d58ba', atk: 120, hp: 600 },
            { name: '神品', color: '#e99037', atk: 280, hp: 1400 },
          ]
        const normalKinds = ['刀', '枪', '弓', '骑'],
          chars = ['悟', '空', '八', '戒', '沙', '僧', '龙', '马']
        const heroPairs = {
          悟空: ['悟', '空'],
          八戒: ['八', '戒'],
          沙僧: ['沙', '僧'],
          白龙马: ['龙', '马'],
        }
        const mapDefs = {
          五行山: {
            sub: '峰回路转 · 适宜发育',
            ground: '#b6a36f',
            river: '#6d8b79',
            accent: '#64734b',
          },
          流沙河: {
            sub: '双流分道 · 弓兵得势',
            ground: '#aebb92',
            river: '#4f8ca2',
            accent: '#477d75',
          },
          火焰山: {
            sub: '炎路狭窄 · 近战争锋',
            ground: '#bb7553',
            river: '#7f372d',
            accent: '#9e492f',
          },
          花果山: {
            sub: '草木藏兵 · 虚实难辨',
            ground: '#83a66c',
            river: '#5f8c8b',
            accent: '#437147',
          },
        }
        function today() {
          return new Date().toISOString().slice(0, 10)
        }
        const defaultSave = () => ({
          player: {
            name: '御弟哥哥',
            currentRank: '凡胎',
            currentStars: 0,
            totalWins: 0,
            merit: 600,
            dailyFreeRevive: 3,
            lastLoginDate: today(),
            streak: 0,
          },
          inventory: {
            weapons: [
              {
                id: 'staff_01',
                name: '凡品金箍棒',
                attackBonus: 15,
                targetHero: '悟空',
              },
            ],
            items: [],
          },
          shop: { lastRefreshTime: 0, items: [] },
          book: { 悟空: 0, 八戒: 0, 沙僧: 0, 白龙马: 0 },
          skin: false,
        })
        let save
        try {
          save = Object.assign(
            defaultSave(),
            JSON.parse(localStorage.getItem('wukongMonkSaveV2') || '{}'),
          )
          save.player = Object.assign(defaultSave().player, save.player)
          save.book = Object.assign(defaultSave().book, save.book)
        } catch (e) {
          save = defaultSave()
        }
        if (save.player.lastLoginDate !== today()) {
          save.player.dailyFreeRevive = 3
          save.player.lastLoginDate = today()
        }
        const persist = () => {
          localStorage.setItem('wukongMonkSaveV2', JSON.stringify(save))
          syncHome()
        }
        function syncHome() {
          document.querySelector('#rankText').textContent =
            `${save.player.currentRank} · ${save.player.currentStars}星`
          document.querySelector('#meritText').textContent =
            `功德 ${save.player.merit}`
        }
        const weekday = new Date().getDay(),
          mapName =
            weekday === 4
              ? '花果山'
              : weekday === 2 || weekday === 6
                ? '流沙河'
                : weekday === 3 || weekday === 0
                  ? '火焰山'
                  : '五行山'
        let state = 'home',
          units = [],
          bench = [],
          particles = [],
          floaters = [],
          drag = null,
          last = 0,
          elapsed = 0,
          food = 5,
          recruits = 0,
          enemyFood = 5,
          aiTimer = 0,
          foodTimer = 0,
          kills = 0,
          wave = 1,
          speed = 1,
          baseHP = 9,
          enemyBaseHP = 9,
          deadTime = 0,
          paused = false,
          shake = 0,
          flash = 0,
          battleWon = false
        function toast(s) {
          const t = document.querySelector('#toast')
          t.textContent = s
          t.classList.add('on')
          clearTimeout(toast.t)
          toast.t = setTimeout(() => t.classList.remove('on'), 1500)
        }
        function recruitCost() {
          return Math.floor(1 + recruits * 0.8)
        }
        function newUnit(side = 'player', forced) {
          let kind =
            forced ||
            (Math.random() < 0.27
              ? chars[Math.floor(Math.random() * chars.length)]
              : normalKinds[Math.floor(Math.random() * normalKinds.length)])
          return {
            id: crypto.randomUUID ? crypto.randomUUID() : Math.random() + '',
            side,
            kind,
            tier: 0,
            hp: 50,
            maxHp: 50,
            atk: 10,
            row: -1,
            col: -1,
            x: 0,
            y: 0,
            cool: Math.random() * 0.6,
            attackCount: 0,
            skillCD: 0,
            healCD: 0,
            slow: 0,
            stun: 0,
            hero: null,
            reserve: null,
            hidden: false,
          }
        }
        function start() {
          state = 'battle'
          home.classList.remove('show')
          modal.classList.remove('show')
          units = []
          bench = []
          particles = []
          floaters = []
          drag = null
          elapsed = 0
          food = 5
          enemyFood = 5
          recruits = 0
          aiTimer = 0
          foodTimer = 0
          kills = 0
          wave = 1
          speed = 1
          baseHP = 9
          enemyBaseHP = 9
          deadTime = 0
          paused = false
          battleWon = false
          last = performance.now()
          for (let i = 0; i < 2; i++) bench.push(newUnit())
          requestAnimationFrame(loop)
        }
        function rankLevel() {
          return Math.min(2, Math.floor((save.player.totalWins || 0) / 3))
        }
        function routeRow(col, current) {
          if (mapName === '火焰山') return 3
          if (mapName === '流沙河')
            return current <= 3 ? (col < 3 ? 1 : 2) : col < 6 ? 5 : 4
          if (mapName === '花果山')
            return [1, 1, 3, 3, 5, 5, 2, 2, 3][Math.max(0, Math.min(8, col))]
          return [1, 1, 4, 4, 2, 2, 5, 5, 3][Math.max(0, Math.min(8, col))]
        }
        function addBench() {
          const cost = recruitCost()
          if (bench.length >= 6) return toast('备战区已满')
          if (food < cost) return toast('斋饭不足')
          food -= cost
          recruits++
          bench.push(newUnit())
          dust(1450, 220, '#f1d17d', 12)
        }
        function deploy(u, row, col) {
          if (col > 3 || occupied(row, col)) return false
          u.row = row
          u.col = col
          u.x = GRID.x + col * GRID.w + 44
          u.y = GRID.y + row * GRID.h + 44
          u.maxHp = tiers[u.tier].hp
          u.hp = Math.min(u.hp, u.maxHp)
          u.atk = tiers[u.tier].atk
          units.push(u)
          dust(u.x, u.y, '#ded0a5', 14)
          activateHeroes()
          return true
        }
        const occupied = (r, c) =>
          units.find(
            (u) =>
              u.hp > 0 &&
              ((u.row === r && u.col === c) ||
                (u.reserve && u.reserve.row === r && u.reserve.col === c)),
          )
        function activateHeroes() {
          for (const [hero, pair] of Object.entries(heroPairs)) {
            const a = units.find(
              (u) => u.side === 'player' && !u.hero && u.kind === pair[0],
            )
            if (!a) continue
            const b = units.find(
              (u) =>
                u.side === 'player' &&
                !u.hero &&
                u.kind === pair[1] &&
                Math.abs(u.row - a.row) + Math.abs(u.col - a.col) === 1,
            )
            if (!b) continue
            units = units.filter((u) => u !== b)
            a.hero = hero
            a.kind = hero === '白龙马' ? '龙马' : hero
            a.reserve = { row: b.row, col: b.col }
            a.tier = Math.max(a.tier, b.tier, 1)
            a.maxHp = tiers[a.tier].hp * 1.45
            a.hp = a.maxHp
            a.atk = tiers[a.tier].atk * 1.35
            save.book[hero] = (save.book[hero] || 0) + 1
            if (Object.values(save.book).every(Boolean)) save.skin = true
            persist()
            burst(a.x, a.y, '#ffd859', 30)
            flash = 0.3
            toast(`${hero} · 神将降临`)
          }
        }
        function merge(a, b) {
          if (
            a === b ||
            a.side !== b.side ||
            a.kind !== b.kind ||
            a.hero ||
            b.hero
          )
            return false
          if (a.tier >= 4) {
            toast('已达大道至简之境')
            return false
          }
          units = units.filter((u) => u !== a)
          b.tier++
          b.maxHp = tiers[b.tier].hp
          b.hp = b.maxHp
          b.atk = tiers[b.tier].atk
          burst(b.x, b.y, tiers[b.tier].color, b.tier === 4 ? 44 : 20)
          if (b.tier === 4) {
            flash = 0.3
            shake = 12
          }
          return true
        }
        function aiSpawn() {
          const level = rankLevel(),
            maxTier = level === 0 ? 1 : level === 1 ? 2 : 4
          let u = newUnit('enemy')
          u.tier = Math.min(
            maxTier,
            Math.random() < 0.42 + level * 0.15
              ? 1 + Math.floor(Math.random() * Math.max(1, maxTier))
              : 0,
          )
          u.maxHp = tiers[u.tier].hp * (1 + level * 0.08)
          u.hp = u.maxHp
          u.atk = tiers[u.tier].atk * (1 + level * 0.07)
          let spots = []
          for (let r = 0; r < 7; r++)
            for (let c = 5; c < 9; c++) if (!occupied(r, c)) spots.push([r, c])
          if (!spots.length) return
          let s = spots[Math.floor(Math.random() * spots.length)]
          if (level === 2) s = spots.sort((a, b) => a[1] - b[1])[0]
          u.row = s[0]
          u.col = s[1]
          u.x = GRID.x + u.col * 88 + 44
          u.y = GRID.y + u.row * 88 + 44
          units.push(u)
          dust(u.x, u.y, '#6c4d69', 10)
        }
        function unitDist(a, b) {

        })
        function openModal(html, closable = true) {
          document.querySelector('#modalBody').innerHTML = html
          document.querySelector('#closeModal').style.display = closable
            ? 'block'
            : 'none'
          modal.classList.add('show')
        }
        document.querySelector('#closeModal').onclick = () =>
          modal.classList.remove('show')
        document.querySelector('#startBtn').onclick = start
        document.querySelector('#bookBtn').onclick = () =>
          openModal(
            `<h2>西游志</h2><div class="list">${Object.entries(heroPairs)
              .map(
                ([h, p]) =>
                  `<div class="entry"><i class="seal">${p.join('')}</i><span><b>${h}</b><small>${save.book[h] ? `已降临 ${save.book[h]} 次` : '尚未结缘'} · ${h === '悟空' ? '定身术' : h === '八戒' ? '吃喝睡' : h === '沙僧' ? '流沙河' : '龙吟横扫'}</small></span><b>${save.book[h] ? '已收录' : '未解锁'}</b></div>`,
              )
              .join(
                '',
              )}</div><p style="font:13px 'PingFang SC';color:#74634d;text-align:center">集齐四神将解锁斗战胜佛外观 ${save.skin ? '· 已解锁' : ''}</p>`,
          )
        function refreshShop(pay = false) {
          if (pay) {
            if (save.player.merit < 50) return toast('功德不足')
            save.player.merit -= 50
          }
          const names = [
            '檀木念珠',
            '精铁枪锋',
            '流云弓弦',
            '金丝袈裟',
            '紧箍咒',
          ]
          save.shop.items = Array.from({ length: 3 }, (_, i) => ({
            name: names[Math.floor(Math.random() * names.length)],
            price: 80 + i * 45,
            desc: ['开局斋饭 +1', '本局攻击 +5%', '神将血量 +8%'][i],
          }))
          save.shop.lastRefreshTime = Date.now()
          persist()
        }
        document.querySelector('#shopBtn').onclick = () => {
          if (
            !save.shop.items?.length ||
            Date.now() - save.shop.lastRefreshTime > 7200000
          )
            refreshShop()
          openModal(
            `<h2>功德铺</h2><div class="list">${save.shop.items.map((it, i) => `<div class="entry"><i class="seal">宝</i><span><b>${it.name}</b><small>${it.desc}</small></span><button onclick="window.__buy(${i})">${it.price} 功德</button></div>`).join('')}</div><button class="secondary" style="width:100%;margin-top:14px" onclick="window.__shopRefresh()">刷新货架 · 50功德</button><p style="font:12px 'PingFang SC';text-align:center;color:#74634d">每2小时自动刷新</p>`,
          )
        }
        window.__buy = (i) => {
          let it = save.shop.items[i]
          if (!it || save.player.merit < it.price) return toast('功德不足')
          save.player.merit -= it.price
          save.inventory.items.push({
            id: 'item_' + Date.now(),
            name: it.name,
            type: 'passive',
            buff: it.desc,
            expireDate: today(),
          })
          save.shop.items.splice(i, 1)
          persist()
          toast('已收入行囊')
          modal.classList.remove('show')
        }
        window.__shopRefresh = () => {
          refreshShop(true)
          modal.classList.remove('show')
          document.querySelector('#shopBtn').click()
        }
        syncHome()
        render()
        if (new URLSearchParams(location.search).has('battle'))
          setTimeout(start, 80)
      })()
    </script>
  </body>
</html>
